<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belz School – Inschrijving</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 { 
      font-size: 24px; 
      color: #1a1a2e; 
      text-align: center; 
      margin-bottom: 6px; 
    }
    h3 { 
      font-size: 18px; 
      color: #1a1a2e; 
      margin-top: 10px; 
      margin-bottom: 12px; 
    }
    .subtitle { 
      color: #666; 
      font-size: 14px; 
      margin-bottom: 28px; 
      text-align: center; 
    }
    .info-box {
      background: #f0f7ff;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #333;
      line-height: 1.7;
    }
    .info-box strong { 
      color: #1a73e8; 
    }
    label { 
      display: block; 
      font-size: 14px; 
      font-weight: 600; 
      color: #333; 
      margin-bottom: 6px; 
    }
    .field-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .field-row label {
      flex: 0 0 160px;
      margin-bottom: 0;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input {
      margin-bottom: 18px;
    }
    input:focus, select:focus { 
      border-color: #1a73e8; 
    }
    .total-box {
      background: #e8f5e9;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 24px;
      text-align: center;
      color: #2e7d32;
      font-size: 16px;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { 
      background: #1558b0; 
    }
    button:disabled { 
      background: #aaa; 
      cursor: not-allowed; 
    }
    .footer-note { 
      font-size: 12px; 
      color: #888; 
      text-align: center; 
      margin-top: 16px; 
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏫 Belz School</h1>
    <p class="subtitle">Inschrijving schooljaar 2026–2027</p>

    <div class="info-box">
      📅 Eerste betaling: <strong>september 2026</strong> (volledig maandbedrag)<br>
      🔄 Daarna automatisch op de <strong>1e van iedere maand</strong><br>
    </div>

    <form id="form">
      <h3>Ouder informatie</h3>
      <label>Naam ouder</label>
      <input type="text" id="parentName" placeholder="Voor-en-Achternaam" required>

      <label>E-mailadres</label>
      <input type="email" id="parentEmail" placeholder="voorbeeld@email.com" required>

      <h3>Aantal kinderen</h3>
      <div class="field-row">
        <label for="numKleuters">Kleuters</label>
        <select id="numKleuters">
          <option value="0">0 kinderen</option>
          <option value="1">1 kind – €170/maand</option>
          <option value="2">2 kinderen – €340/maand</option>
          <option value="3">3 kinderen – €510/maand</option>
          <option value="4">4 kinderen – €680/maand</option>
          <option value="5">5 kinderen – €850/maand</option>
        </select>
      </div>
      <div class="field-row">
        <label for="numLagereSchool">Lagere School</label>
        <select id="numLagereSchool">
          <option value="0">0 kinderen</option>
          <option value="1">1 kind – €190/maand</option>
          <option value="2">2 kinderen – €380/maand</option>
          <option value="3">3 kinderen – €570/maand</option>
          <option value="4">4 kinderen – €760/maand</option>
          <option value="5">5 kinderen – €950/maand</option>
        </select>
      </div>
      <div class="field-row">
        <label for="numMiddelbar">Middelbar</label>
        <select id="numMiddelbar">
          <option value="0">0 kinderen</option>
          <option value="1">1 kind – €250/maand</option>
          <option value="2">2 kinderen – €500/maand</option>
          <option value="3">3 kinderen – €750/maand</option>
          <option value="4">4 kinderen – €1000/maand</option>
          <option value="5">5 kinderen – €1250/maand</option>
        </select>
      </div>
      <div class="field-row">
        <label for="numMipiOilelim">Mipi Oilelim</label>
        <select id="numMipiOilelim">
          <option value="0">0 kinderen</option>
          <option value="1">1 kind – €200/maand</option>
          <option value="2">2 kinderen – €400/maand</option>
          <option value="3">3 kinderen – €600/maand</option>
          <option value="4">4 kinderen – €800/maand</option>
          <option value="5">5 kinderen – €1000/maand</option>
        </select>
      </div>

      <div class="total-box" id="totalDisplay">Maandelijks totaal: €0</div>

      <button type="submit" id="btn">Doorgaan naar betaling →</button>
    </form>

    <p class="footer-note">🔒 Beveiligde betaling via Stripe</p>
  </div>

  <script>
    // pricemap
    const prcKleuters = 170;
    const prcLagereSchool = 190;
    const prcMiddelbar = 250;
    const prcMipiOilelim = 200;

    //update total on change
    const selects = document.querySelectorAll('select');
    const totalDisplay = document.getElementById('totalDisplay');
    selects.forEach(select => {
      select.addEventListener('change', () => {
        const numKleuters = parseInt(document.getElementById('numKleuters').value);
        const numLagereSchool = parseInt(document.getElementById('numLagereSchool').value);
        const numMiddelbar = parseInt(document.getElementById('numMiddelbar').value);
        const numMipiOilelim = parseInt(document.getElementById('numMipiOilelim').value);
        const totalprice = (numKleuters * prcKleuters) + (numLagereSchool * prcLagereSchool) + (numMiddelbar * prcMiddelbar) + (numMipiOilelim * prcMipiOilelim);
        totalDisplay.textContent = `Maandelijks totaal: €${totalprice}`;
      });
    });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Verwerken...';

      const payload = {
        parentName: document.getElementById('parentName').value,
        parentEmail: document.getElementById('parentEmail').value,
        numChildren: {
          kleuters: parseInt(document.getElementById('numKleuters').value),
          lagereSchool: parseInt(document.getElementById('numLagereSchool').value),
          middelbar: parseInt(document.getElementById('numMiddelbar').value),
          mipiOilelim: parseInt(document.getElementById('numMipiOilelim').value),
        },
      };

      try {
        const res = await fetch('/api/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
    
        if (data.error) {
          throw new Error(data.error);
        }

        // Standard single school submission
        if (data.url) {
          sessionStorage.removeItem('stripe_checkout_queue'); // Clear any old queue
          window.location.href = data.url;
          return;
        }

        // Multi-school submission
        if (data.urls && data.urls.length > 0) {
          // Save all URLs to browser memory
          sessionStorage.setItem('stripe_checkout_queue', JSON.stringify(data.urls));
      
          // Shift out the first URL and navigate to it
          const nextQueue = [...data.urls];
          const firstUrl = nextQueue.shift();
      
          // Update browser memory with remaining targets
          sessionStorage.setItem('stripe_checkout_queue', JSON.stringify(nextQueue));
      
          window.location.href = firstUrl;
        } 
        else {
          throw new Error('Geen geldige sessie-URL ontvangen');
        }
      } 
      catch (err) {
        // Dynamically prints exact backend crash reasoning inside an alert window
        console.error(err);
        alert(`Er is een fout opgetreden: ${err.message}`);
        btn.disabled = false;
        btn.textContent = 'Doorgaan naar betaling →';
      }
    });
  </script>
</body>
</html>
