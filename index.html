<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belz School – Inschrijving</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #ebeef2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px 24px 18px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(1, 89, 137, 0.12);
    }
    img.header{ 
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 8px auto;
    }
    img.footer{ 
      width: 100%;
      max-width: 480px;
      margin-top: 20px;
    }
    h3 { 
      font-size: 17px; 
      color: #1a1a2e; 
      margin-top: 8px; 
      margin-bottom: 10px; 
    }
    .subtitle { 
      color: #666; 
      font-size: 14px; 
      margin-top: 0;
      margin-bottom: 16px; 
      text-align: center; 
    }
    .info-box {
      background: #edf3f7;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 13px;
      color: #1d2b36;
      line-height: 1.5;
    }
    .info-box strong { 
      color: #015989; 
    }
    label { 
      display: block; 
      font-size: 13px; 
      font-weight: 600; 
      color: #333; 
      margin-bottom: 5px; 
    }
    .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .field-row label {
      flex: 0 0 145px;
      margin-bottom: 0;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #d4dbe2;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #f9fafb;
    }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .full-width {
      width: 100%;
    }
    input {
      margin-bottom: 12px;
    }
    input:focus, select:focus { 
      border-color: #992678; 
      box-shadow: 0 0 0 3px rgba(153, 38, 120, 0.12);
    }
    .total-box {
      background: #e8f5e9;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 24px;
      text-align: center;
      color: #2e7d32;
      font-size: 16px;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 12px 14px;
      background: #015989;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      margin-top: 12px;
    }
    button:hover { 
      background: #992678;
      transform: translateY(-1px);
    }
    button:disabled { 
      background: #aaa; 
      cursor: not-allowed; 
    }
    .footer-note { 
      font-size: 12px; 
      color: #888; 
      text-align: center; 
      margin-top: 16px; 
    }
    .copyright { 
      font-size: 15px; 
      color: #aaa; 
      text-align: center; 
      margin-top: 12px; 
    }
    .quick {
      color: #015989;
      font-family: "Montserrat", sans-serif;
      font-optical-sizing: auto;
      font-weight: 800;
      font-style: normal;
   }
   .click {
      color: #992678;
      font-family: "Montserrat", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
   }
  </style>
</head>
<body>
  <div class="card">
    <img src="./img/header.png" alt="Belz School Logo" class="header">
    <p class="subtitle">Inschrijving schooljaar 2026–2027</p>

    <div class="info-box">
      Deze betaling wordt automatisch op de eerste dag vean de maand afgeschreven.
    </div>

    <form id="form">
      <h3>Ouder informatie</h3>
      <label>Naam ouder</label>
      <input type="text" id="parentName" placeholder="Voor-en-Achternaam" required>

      <label>E-mailadres</label>
      <input type="email" id="parentEmail" placeholder="voorbeeld@email.com" required>

      <h3>Factuurgegevens</h3>
      <label>Factuurnaam</label>
      <input type="text" id="invoiceName" placeholder="Naam op factuur" required>

      <label>Adres</label>
      <input type="text" id="billingStreet" placeholder="Straat + huisnummer" required>

      <div class="two-col">
        <div>
          <label>Postcode</label>
          <input type="text" id="billingPostalCode" placeholder="1234" required>
        </div>
        <div>
          <label>Plaats</label>
          <input type="text" id="billingCity" placeholder="Gemeente" required>
        </div>
      </div>

      <label>Land</label>
      <select id="billingCountry" required>
        <option value="BE">België</option>
        <option value="NL">Nederland</option>
      </select>

      <h3>Aantal kinderen</h3>
      <div class="field-row">
        <label for="numKleuters">Kleuters</label>
        <select id="numKleuters">
          <option value="0">0 kinderen</option>
          <option value="1">1 kind – €170/maand</option>
          <option value="2">2 kinderen – €340/maand</option>
          <option value="3">3 kinderen – €510/maand</option>
          <option value="4">4 kinderen – €680/maand</option>
          <option value="5">5 kinderen – €850/maand</option>
        </select>
      </div>
      <div class="field-row">
        <label for="numLagereSchool">Lagere School</label>
        <select id="numLagereSchool">
          <option value="0">0 kinderen</option>
          <option value="1">1 kind – €190/maand</option>
          <option value="2">2 kinderen – €380/maand</option>
          <option value="3">3 kinderen – €570/maand</option>
          <option value="4">4 kinderen – €760/maand</option>
          <option value="5">5 kinderen – €950/maand</option>
        </select>
      </div>
      <div class="field-row">
        <label for="numMiddelbar">Middelbar</label>
        <select id="numMiddelbar">
          <option value="0">0 kinderen</option>
          <option value="1">1 kind – €250/maand</option>
          <option value="2">2 kinderen – €500/maand</option>
          <option value="3">3 kinderen – €750/maand</option>
          <option value="4">4 kinderen – €1000/maand</option>
          <option value="5">5 kinderen – €1250/maand</option>
        </select>
      </div>
      <div class="field-row">
        <label for="numMipiOilelim">Mipi Oilelim</label>
        <select id="numMipiOilelim">
          <option value="0">0 kinderen</option>
          <option value="1">1 kind – €200/maand</option>
          <option value="2">2 kinderen – €400/maand</option>
          <option value="3">3 kinderen – €600/maand</option>
          <option value="4">4 kinderen – €800/maand</option>
          <option value="5">5 kinderen – €1000/maand</option>
        </select>
      </div>

      <button type="submit" id="btn">Doorgaan naar betaling →</button>
    </form>

    <img src="./img/footer.png" alt="Belz School Footer" class="footer">

    <p class="footer-note">🔒 Beveiligde betaling via Stripe</p>
    <p class="copyright"><strong>&copy;</strong> <span class="quick">Quick</span><span class="click">Click</span> 2026</p>
  </div>

  <script>
    const STORAGE_KEY = 'belz_school_checkout_form';
    const SESSION_STORAGE_KEY = 'belz_school_checkout_form_session';

    const prcKleuters = 170;
    const prcLagereSchool = 190;
    const prcMiddelbar = 250;
    const prcMipiOilelim = 200;

    function getFormState() {
      return {
        parentName: document.getElementById('parentName').value,
        parentEmail: document.getElementById('parentEmail').value,
        invoiceName: document.getElementById('invoiceName').value,
        billingDetails: {
          street: document.getElementById('billingStreet').value,
          postalCode: document.getElementById('billingPostalCode').value,
          city: document.getElementById('billingCity').value,
          country: document.getElementById('billingCountry').value,
        },
        numChildren: {
          kleuters: parseInt(document.getElementById('numKleuters').value, 10) || 0,
          lagereSchool: parseInt(document.getElementById('numLagereSchool').value, 10) || 0,
          middelbar: parseInt(document.getElementById('numMiddelbar').value, 10) || 0,
          mipiOilelim: parseInt(document.getElementById('numMipiOilelim').value, 10) || 0,
        },
      };
    }

    function saveFormState() {
      const state = getFormState();
      const serialized = JSON.stringify(state);
      localStorage.setItem(STORAGE_KEY, serialized);
      sessionStorage.setItem(SESSION_STORAGE_KEY, serialized);
    }

    function restoreFormState() {
      try {
        const savedLocal = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        const savedSession = JSON.parse(sessionStorage.getItem(SESSION_STORAGE_KEY) || '{}');
        const saved = Object.keys(savedSession).length ? savedSession : savedLocal;

        if (saved.parentName) document.getElementById('parentName').value = saved.parentName;
        if (saved.parentEmail) document.getElementById('parentEmail').value = saved.parentEmail;
        if (saved.invoiceName) document.getElementById('invoiceName').value = saved.invoiceName;

        if (saved.billingDetails) {
          if (saved.billingDetails.street) document.getElementById('billingStreet').value = saved.billingDetails.street;
          if (saved.billingDetails.postalCode) document.getElementById('billingPostalCode').value = saved.billingDetails.postalCode;
          if (saved.billingDetails.city) document.getElementById('billingCity').value = saved.billingDetails.city;
          if (saved.billingDetails.country) document.getElementById('billingCountry').value = saved.billingDetails.country;
        }

        if (saved.numChildren) {
          if (saved.numChildren.kleuters !== undefined) document.getElementById('numKleuters').value = String(saved.numChildren.kleuters);
          if (saved.numChildren.lagereSchool !== undefined) document.getElementById('numLagereSchool').value = String(saved.numChildren.lagereSchool);
          if (saved.numChildren.middelbar !== undefined) document.getElementById('numMiddelbar').value = String(saved.numChildren.middelbar);
          if (saved.numChildren.mipiOilelim !== undefined) document.getElementById('numMipiOilelim').value = String(saved.numChildren.mipiOilelim);
        }
      } catch (err) {
        console.warn('Could not restore saved form data', err);
      }
    }

    restoreFormState();
    document.getElementById('form').addEventListener('input', saveFormState);
    document.getElementById('form').addEventListener('change', saveFormState);

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      saveFormState();

      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Verwerken...';

      const payload = getFormState();

      try {
        const res = await fetch('/api/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
    
        if (data.error) {
          throw new Error(data.error);
        }

        // Standard single school submission
        if (data.url) {
          sessionStorage.removeItem('stripe_checkout_queue');
          sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(payload));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          window.location.href = data.url;
          return;
        }

        // Multi-school submission
        if (data.urls && data.urls.length > 0) {
          sessionStorage.setItem('stripe_checkout_queue', JSON.stringify(data.urls));
          sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(payload));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          const nextQueue = [...data.urls];
          const firstUrl = nextQueue.shift();
          sessionStorage.setItem('stripe_checkout_queue', JSON.stringify(nextQueue));
          window.location.href = firstUrl;
        } 
        else {
          throw new Error('Geen geldige sessie-URL ontvangen');
        }
      } 
      catch (err) {
        console.error(err);
        alert(`Er is een fout opgetreden: ${err.message}`);
        btn.disabled = false;
        btn.textContent = 'Doorgaan naar betaling →';
      }
    });
  </script>
</body>
</html>
