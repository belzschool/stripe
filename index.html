<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belz School – Inschrijving</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 { 
      font-size: 24px; 
      color: #1a1a2e; 
      text-align: center; 
      margin-bottom: 6px; 
    }
    h3 { 
      font-size: 18px; 
      color: #1a1a2e; 
      margin-top: 10px; 
      margin-bottom: 12px; 
    }
    .subtitle { 
      color: #666; 
      font-size: 14px; 
      margin-bottom: 28px; 
      text-align: center; 
    }
    .info-box {
      background: #f0f7ff;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #333;
      line-height: 1.7;
    }
    .info-box strong { 
      color: #1a73e8; 
    }
    label { 
      display: block; 
      font-size: 14px; 
      font-weight: 600; 
      color: #333; 
      margin-bottom: 6px; 
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { 
      border-color: #1a73e8; 
    }
    .total-box {
      background: #e8f5e9;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 24px;
      text-align: center;
      color: #2e7d32;
      font-size: 16px;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { 
      background: #1558b0; 
    }
    button:disabled { 
      background: #aaa; 
      cursor: not-allowed; 
    }
    .footer-note { 
      font-size: 12px; 
      color: #888; 
      text-align: center; 
      margin-top: 16px; 
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏫 Belz School</h1>
    <p class="subtitle">Inschrijving schooljaar 2026–2027</p>

    <div class="info-box">
      📅 Eerste betaling: <strong>september 2026</strong> (volledig maandbedrag)<br>
      🔄 Daarna automatisch op de <strong>1e van iedere maand</strong><br>
      💶 <strong>Prijs per kind per maand</strong> via SEPA-incasso
    </div>

    <form id="form">
      <h3>Ouder informatie</h3>
      <label>Achternaam ouder</label>
      <input type="text" id="parentName" placeholder="Achternaam" required>
      
      <label>Voornaam ouder</label>
      <input type="text" id="parentFirstName" placeholder="Voornaam" required>

      <label>E-mailadres</label>
      <input type="email" id="parentEmail" placeholder="voorbeeld@email.com" required>

      <label>Namen van de kinderen</label>
      <input type="text" id="childrenNames" placeholder="voornaam/en" required>

      <h3>Aantal kinderen</h3>
      <label>Kleuters</label>
      <select id="numKleuters">
        <option value="0">0 kinderen</option>
        <option value="1">1 kind – €170/maand</option>
        <option value="2">2 kinderen – €340/maand</option>
        <option value="3">3 kinderen – €510/maand</option>
        <option value="4">4 kinderen – €680/maand</option>
        <option value="5">5 kinderen – €850/maand</option>
      </select>
      <label>Lagere School</label>
      <select id="numLagereSchool">
        <option value="0">0 kinderen</option>
        <option value="1">1 kind – €185/maand</option>
        <option value="2">2 kinderen – €370/maand</option>
        <option value="3">3 kinderen – €555/maand</option>
        <option value="4">4 kinderen – €740/maand</option>
        <option value="5">5 kinderen – €925/maand</option>
      </select>
      <label>Middelbar</label>
      <select id="numMiddelbar">
        <option value="0">0 kinderen</option>
        <option value="1">1 kind – €200/maand</option>
        <option value="2">2 kinderen – €400/maand</option>
        <option value="3">3 kinderen – €600/maand</option>
        <option value="4">4 kinderen – €800/maand</option>
        <option value="5">5 kinderen – €1000/maand</option>
      </select>
      <label>Mipi Oilelim</label>
      <select id="numMipiOilelim">
        <option value="0">0 kinderen</option>
        <option value="1">1 kind – €220/maand</option>
        <option value="2">2 kinderen – €440/maand</option>
        <option value="3">3 kinderen – €660/maand</option>
        <option value="4">4 kinderen – €880/maand</option>
        <option value="5">5 kinderen – €1100/maand</option>
      </select>

      <div class="total-box" id="totalDisplay">Maandelijks totaal: €0</div>

      <button type="submit" id="btn">Doorgaan naar betaling →</button>
    </form>

    <p class="footer-note">🔒 Beveiligde betaling via Stripe</p>
  </div>

  <script>
    const selK = document.getElementById('numKleuters');
    const selLS = document.getElementById('numLagereSchool');
    const selM = document.getElementById('numMiddelbar');
    const selMO = document.getElementById('numMipiOilelim');

    const institutionPricing = {
      kleuters: 170,
      lagereSchool: 185,
      middelbar: 200,
      mipiOilelim: 220,
    };

    const display = document.getElementById('totalDisplay');

    [selK, selLS, selM, selMO].forEach((select) => {
      select.addEventListener('change', () => {
        display.textContent = `Maandelijks totaal: €${
          (parseInt(selK.value) * institutionPricing.kleuters) +
          (parseInt(selLS.value) * institutionPricing.lagereSchool) +
          (parseInt(selM.value) * institutionPricing.middelbar) +
          (parseInt(selMO.value) * institutionPricing.mipiOilelim)
        }`;
      });
    });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Loading...';

      try {
        const res = await fetch('/api/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            parentName: document.getElementById('parentName').value,
            parentEmail: document.getElementById('parentEmail').value,
            childrenNames: document.getElementById('childrenNames').value,
            numChildren: {
              kleuters: parseInt(selK.value),
              lagereSchool: parseInt(selLS.value),
              middelbar: parseInt(selM.value),
              mipiOilelim: parseInt(selMO.value),
            },
          }),
        });

        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else if (data.urls && data.urls.length) {
          const firstUrl = data.urls[0];
          window.location.href = firstUrl;
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        alert('Er is een fout opgetreden. Probeer het opnieuw.');
        btn.disabled = false;
        btn.textContent = 'Doorgaan naar betaling →';
      }
    });
  </script>
</body>
</html>
