<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belz School – Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #ebeef2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px 24px 18px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(1, 89, 137, 0.12);
      text-align: center;
    }
    img.header {
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 8px auto;
    }
    img.footer {
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 16px auto 0 auto;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0;
      position: relative;
      background: #f2edf7;
      border: 4px solid #992678;
      animation: pulseCheck 0.6s ease-out;
    }
    .icon::before {
      content: "";
      width: 20px;
      height: 10px;
      border-left: 5px solid #015989;
      border-bottom: 5px solid #015989;
      transform: rotate(-45deg) scale(0.9);
      display: block;
      margin-top: -4px;
      animation: drawCheck 0.5s ease-out 0.15s both;
    }
    h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 12px; }
    p { font-size: 15px; color: #444; line-height: 1.6; margin-bottom: 24px; }
    .footer-note {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 12px;
    }
    .copyright {
      font-size: 15px;
      color: #aaa;
      text-align: center;
      margin-top: 8px;
    }
    .quick {
      color: #015989;
      font-family: "Montserrat", sans-serif;
      font-optical-sizing: auto;
      font-weight: 800;
      font-style: normal;
    }
    .click {
      color: #992678;
      font-family: "Montserrat", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
    }
    .loader {
      border: 4px solid #eef2f5;
      border-top: 4px solid #015989;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseCheck {
      0% { transform: scale(0.7); opacity: 0.5; }
      70% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes drawCheck {
      0% { opacity: 0; transform: rotate(-45deg) scale(0.3); }
      100% { opacity: 1; transform: rotate(-45deg) scale(0.9); }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./img/header.png" alt="Belz School Logo" class="header">
    <h1 id="statusTitle">Betaling controleren...</h1>
    <div id="loadingAnimation" class="loader"></div>
    <p id="statusMessage">Een moment geduld alstublieft.</p>

    <img src="./img/footer.png" alt="Belz School Footer" class="footer">
    <p class="copyright"><strong>&copy;</strong> <span class="quick">Quick</span><span class="click">Click</span> 2026</p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const icon = document.getElementById('statusIcon');
      const title = document.getElementById('statusTitle');
      const msg = document.getElementById('statusMessage');
      const loader = document.getElementById('loadingAnimation');

      // 1. Fetch remaining steps from storage
      let queue = [];
      try {
        queue = JSON.parse(sessionStorage.getItem('stripe_checkout_queue')) || [];
      } catch (e) {
        queue = [];
      }

      // 2. Handle Multi-School Flow Redirect
      if (queue.length > 0) {
        icon.classList.add('success-check');
        title.textContent = 'Eerste deel voltooid!';
        msg.textContent = 'Uw betalingsmandaat is goedgekeurd. U wordt nu binnen 3 seconden automatisch doorgestuurd naar het volgende formulier om uw resterende inschrijving af te ronden...';
        
        // Take next URL out of storage queue
        const nextUrl = queue.shift();
        sessionStorage.setItem('stripe_checkout_queue', JSON.stringify(queue));

        // Route them onward after a small visual pause
        setTimeout(() => {
          window.location.href = nextUrl;
        }, 3000);

      // 3. Handle Full Final Success
      } else {
        icon.classList.add('success-check');
        title.textContent = 'Inschrijving Succesvol!';
        loader.style.display = 'none';
        msg.textContent = 'Hartelijk dank! Alle inschrijvingen en SEPA-machtingen zijn succesvol verwerkt voor het schooljaar 2026–2027. U ontvangt spoedig een bevestigingsmail.';
        sessionStorage.removeItem('stripe_checkout_queue');
        localStorage.removeItem('belz_school_checkout_form');
      }
    });
  </script>
</body>
</html>
